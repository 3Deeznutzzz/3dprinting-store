<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }} - 3Deeznutzzz</title>
    <style>
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            color: #00bfff;
        }
        .container {
            padding: 20px;
        }
        .product-box {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 8px;
        }
        form {
            margin-top: 20px;
        }
        input, button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #00bfff;
            color: #000;
            cursor: pointer;
        }
        a {
            color: #ff5252;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>3Deeznutzzz</header>
    <div class="container">
        <a href="/">← Back to Home</a>
        <div class="product-box">
            <h2>{{ product.title }}</h2>
            <p>{{ product.description }}</p>
            <form method="POST">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">I'm Interested</button>
            </form>
        </div>
    </div>
</body>
</html>
