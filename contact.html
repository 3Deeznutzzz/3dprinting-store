<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - 3Deeznutzzz</title>
    <style>
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            color: #00bfff;
        }
        .container {
            padding: 20px;
        }
        form {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
        }
        input, textarea, button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #00bfff;
            color: #000;
            cursor: pointer;
        }
        a {
            color: #ff5252;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>3Deeznutzzz</header>
    <div class="container">
        <a href="/">← Back to Home</a>
        <form method="POST">
            <h2>Contact Us</h2>
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>
