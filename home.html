<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3Deeznutzzz - Home</title>
    <style>
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            color: #00bfff;
        }
        .container {
            padding: 20px;
        }
        .product {
            background-color: #2c2c2c;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }
        a {
            color: #ff5252;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .nav {
            text-align: center;
            margin: 15px;
        }
        .nav a {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <header>3Deeznutzzz</header>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/contact">Contact</a>
    </div>
    <div class="container">
        <h2>Available Prints</h2>
        {% for product in products %}
        <div class="product">
            <h3>{{ product.title }}</h3>
            <p>{{ product.description }}</p>
            <a href="/product/{{ product.id }}">View Product</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
